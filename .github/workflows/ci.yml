name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Lifecycle scripts of dependencies are blocked by pnpm 10 and strictDepBuilds in pnpm-workspace.yaml.
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - run: pnpm check:licenses
      - run: pnpm lint
      - run: pnpm typecheck
      # Generated code and docs must match their sources (registry, schema, rule registry).
      - run: pnpm gen:check
      - run: pnpm docs:check
      - run: pnpm build
      # Mojang's block metadata is not committed (not MIT); fetch the pinned, checksummed copy for the mapping tests.
      - run: pnpm fetch:bedrock-data
      # Java's block report (M9) is generated from the pinned server jar by its own data generator, in a Java 25
      # container (Docker is on the runner); not committed either.
      - run: pnpm fetch:java-data
      - run: pnpm test
        env:
          RSD_REQUIRE_BEDROCK_DATA: "1"
          RSD_REQUIRE_JAVA_DATA: "1"

  e2e:
    # Viewer tests in headless Chromium (SwiftShader WebGL) against the built site and the single-file bundle.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
