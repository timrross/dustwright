# nginx snippet for serving apps/site/dist. Include it in the server block for dustwright.dev.
# Keep in step with apps/site/csp.ts (tested).
root /srv/dustwright/dist;
index index.html;

add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https:; img-src 'self' data:; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# Markdown is not in nginx's default MIME table. (No add_header in locations: nginx would drop the ones above.)
location = /AUTHORING.md {
  default_type "text/markdown; charset=utf-8";
}

location / {
  try_files $uri $uri/ $uri.html =404;
}
