<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dustwright playground</title>
  </head>
  <body>
    <header>
      <strong>Dustwright</strong>
      <span>Playground</span>
      <a href="../">Home</a>
    </header>
    <main class="play">
      <div class="bar">
        <label for="example">Example</label>
        <select id="example"></select>
        <span id="status" class="status" role="status" aria-live="polite"></span>
      </div>
      <textarea id="editor" spellcheck="false" aria-label="Design JSON"></textarea>
      <redstone-viewer id="viewer" theme="auto"></redstone-viewer>
      <ul id="diagnostics" class="diagnostics" aria-label="Diagnostics"></ul>
    </main>
    <script type="module" src="../src/play.ts"></script>
  </body>
</html>
